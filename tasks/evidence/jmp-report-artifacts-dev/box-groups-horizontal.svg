<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="report-title report-description"><title id="report-title">Box plot</title><desc id="report-description">Type 6 quantiles with integer-frequency replication. Hollow boxes show quartiles, thick lines medians, capped stems observed-data whiskers, circles visible Tukey outlier source rows. Hidden rows remain in summaries.</desc><style>text{font-family:sans-serif;font-size:12px;fill:#17212b}line{stroke:#17212b;stroke-width:1.5}.axis{stroke:#17212b;stroke-width:1}.box{fill:white;stroke:#17212b;stroke-width:2}.bar{fill:#2877a8;stroke:#17212b;stroke-width:0.6}.median{stroke:#111;stroke-width:3}</style><rect width="1000" height="800" fill="white"/><text x="500" y="22" text-anchor="middle">Box plot</text><line x1="65" y1="662" x2="972" y2="662" class="axis"/><line x1="65" y1="662" x2="65" y2="666" class="axis"/><text data-role="value-tick-label" data-value="-3" x="65" y="680" text-anchor="middle">-3</text><line x1="291.75" y1="662" x2="291.75" y2="666" class="axis"/><text data-role="value-tick-label" data-value="22.75" x="291.75" y="680" text-anchor="middle">22.75</text><line x1="518.5" y1="662" x2="518.5" y2="666" class="axis"/><text data-role="value-tick-label" data-value="48.5" x="518.5" y="680" text-anchor="middle">48.5</text><line x1="745.25" y1="662" x2="745.25" y2="666" class="axis"/><text data-role="value-tick-label" data-value="74.25" x="745.25" y="680" text-anchor="middle">74.25</text><line x1="972" y1="662" x2="972" y2="666" class="axis"/><text data-role="value-tick-label" data-value="100" x="972" y="680" text-anchor="middle">100</text><text x="518.5" y="698" text-anchor="middle">Value</text><defs><clipPath id="box-clip"><rect x="61" y="72" width="915" height="594"/></clipPath></defs><text x="16" y="722" text-anchor="start">Group</text><text x="150" y="722" text-anchor="start">Minimum</text><text x="312" y="722" text-anchor="start">Q1</text><text x="474" y="722" text-anchor="start">Median</text><text x="636" y="722" text-anchor="start">Q3</text><text x="798" y="722" text-anchor="start">Maximum</text><text x="55" y="226.5" text-anchor="end">Group 0</text><g clip-path="url(#box-clip)" data-group-id="0"><title>Group 0; N=7; Minimum 0; Q1 1; median 3; Q3 5; maximum 100; whiskers 0 to 100</title><line x1="91.41747572815534" y1="222.5" x2="972" y2="222.5" id="stem-0" data-role="whisker-stem" data-group-id="0"/><line x1="91.41747572815534" y1="205.7" x2="91.41747572815534" y2="239.3" id="cap-0-lower" data-role="whisker-cap" data-end="lower" data-group-id="0"/><line x1="972" y1="205.7" x2="972" y2="239.3" id="cap-0-upper" data-role="whisker-cap" data-end="upper" data-group-id="0"/><rect id="box-0" class="box" data-role="box" data-group-id="0" x="100.2233009708738" y="194.5" width="35.223300970873794" height="56"/><line x1="117.83495145631068" y1="194.5" x2="117.83495145631068" y2="250.5" id="median-0" class="median" data-role="median" data-group-id="0"/><line x1="91.41747572815534" y1="194.5" x2="91.41747572815534" y2="250.5" id="tick-0-0" data-role="quantile-tick" data-probability="0.025" data-group-id="0"/><line x1="91.41747572815534" y1="194.5" x2="91.41747572815534" y2="250.5" id="tick-0-1" data-role="quantile-tick" data-probability="0.1" data-group-id="0"/><line x1="972" y1="194.5" x2="972" y2="250.5" id="tick-0-2" data-role="quantile-tick" data-probability="0.9" data-group-id="0"/><line x1="972" y1="194.5" x2="972" y2="250.5" id="tick-0-3" data-role="quantile-tick" data-probability="0.975" data-group-id="0"/></g><text x="16" y="740" text-anchor="start">0</text><text x="150" y="740" text-anchor="start">0</text><text x="312" y="740" text-anchor="start">1</text><text x="474" y="740" text-anchor="start">3</text><text x="636" y="740" text-anchor="start">5</text><text x="798" y="740" text-anchor="start">100</text><text x="55" y="519.5" text-anchor="end">Group 7</text><g clip-path="url(#box-clip)" data-group-id="7"><tit