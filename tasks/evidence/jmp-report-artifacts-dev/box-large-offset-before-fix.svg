<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="report-title report-description"><title id="report-title">Box plot</title><desc id="report-description">Type 6 quantiles with integer-frequency replication. Hollow boxes show quartiles, thick lines medians, capped stems observed-data whiskers, circles visible Tukey outlier source rows. Hidden rows remain in summaries.</desc><style>text{font-family:sans-serif;font-size:12px;fill:#17212b}line{stroke:#17212b;stroke-width:1.5}.axis{stroke:#17212b;stroke-width:1}.box{fill:white;stroke:#17212b;stroke-width:2}.bar{fill:#2877a8;stroke:#17212b;stroke-width:0.6}.median{stroke:#111;stroke-width:3}</style><rect width="1000" height="600" fill="white"/><text x="500" y="22" text-anchor="middle">Box plot</text><line x1="135" y1="76" x2="135" y2="480" class="axis"/><line x1="131" y1="480" x2="135" y2="480" class="axis"/><text data-role="value-tick-label" data-value="1000000000000" x="128" y="484" text-anchor="end">1e12</text><line x1="131" y1="379" x2="135" y2="379" class="axis"/><text data-role="value-tick-label" data-value="1000000000000.005" x="128" y="383" text-anchor="end">1000000000000.005</text><line x1="131" y1="278" x2="135" y2="278" class="axis"/><text data-role="value-tick-label" data-value="1000000000000.01" x="128" y="282" text-anchor="end">1000000000000.01</text><line x1="131" y1="177" x2="135" y2="177" class="axis"/><text data-role="value-tick-label" data-value="1000000000000.015" x="128" y="181" text-anchor="end">1000000000000.015</text><line x1="131" y1="76" x2="135" y2="76" class="axis"/><text data-role="value-tick-label" data-value="1000000000000.02" x="128" y="80" text-anchor="end">1000000000000.02</text><text x="135" y="64" text-anchor="start">Value</text><defs><clipPath id="box-clip"><rect x="131" y="72" width="833" height="412"/></clipPath></defs><text x="16" y="540" text-anchor="start">Group</text><text x="150" y="540" text-anchor="start">Minim