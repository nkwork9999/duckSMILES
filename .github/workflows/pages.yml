name: Publish documentation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - run: test -f index.html && test -f functions.html && test -f python.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
