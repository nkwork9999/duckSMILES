name: Rust descriptor regression tests
on:
  push:
    branches: [main, feature/rdkit-parity]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check cross-compilation target selection
        run: cmake -P cmake/test_rust_target.cmake
      - name: Check MSVC fmt shim in generated C translation units
        run: python3 scripts/check_msvc_fmt_compat.py
      - name: Check prebuilt DuckDB version alignment
        run: python3 -m unittest discover -s scripts -p test_prebuilt_duckdb_version.py
      - name: Test Wasm linkage validator
        run: node --test scripts/check_wasm_linkage.test.cjs
      - name: Test workspace, including pinned RDKit reference fixtures
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ducksmiles-target
        run: cargo test --workspace --locked

  lean-descriptors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the pinned Lean toolchain
        run: |
          version=$(sed 's/^leanprover\/lean4:v//' verification/lean/lean-toolchain)
          archive="lean-${version}-linux"
          curl -fsSL --retry 3 "https://github.com/leanprover/lean4/releases/download/v${version}/${archive}.tar.zst" | tar --zstd -x -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive/bin" >> "$GITHUB_PATH"
      - name: Build and verify the executable specification
        working-directory: verification/lean
        run: lake build && lake env lean Tests.lean
      - name: Compare the complete native profile with the independent oracle
        run: |
          python -m pip install 'rdkit==2026.3.6'
          cargo rustc --release --locked -p ducksmiles_smiles --lib --crate-type cdylib
          python verification/lean/integration.py target/release/libducksmiles_smiles.so
