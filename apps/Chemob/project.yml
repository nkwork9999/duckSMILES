name: Chemob
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  ChemobCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
targets:
  Chemob:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
    preBuildScripts:
      - name: Build DuckSMILES
        script: '"$SRCROOT/scripts/build-engine.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chemob.workbench
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleDisplayName: Chemob
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_OBJC_BRIDGING_HEADER: App/Engine.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Generated/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "-lducksmiles_smiles"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: ChemobCore
  ChemobUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        buildPhase: resources
      - path: Core/Tests/ChemobCoreTests/DescriptorFormattingTests.swift
    dependencies:
      - target: Chemob
      - package: ChemobCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.chemob.workbench.tests
schemes:
  Chemob:
    build:
      targets:
        Chemob: all
    test:
      targets: [ChemobUITests]
